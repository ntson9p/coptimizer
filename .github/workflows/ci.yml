name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted runners are fresh VMs thrown away after each run; the tests
    # allow Administrator rights only there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test, with coverage minimums
        shell: pwsh
        run: ./scripts/test.ps1 -Cover
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1

  race:
    # Go's race detector needs a C compiler (cgo); GitHub's Windows runners
    # come with one, unlike most development PCs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test with the race detector
        shell: pwsh
        run: ./scripts/test.ps1 -Race

  destructive:
    # Real cleanups by the real exe, with Administrator rights, on this
    # throwaway VM only: the script refuses to run anywhere else.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Destructive tests
        shell: pwsh
        env:
          COPTIMIZER_DESTRUCTIVE: "1"
        run: ./scripts/destructive.ps1
